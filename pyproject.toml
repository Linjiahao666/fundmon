[project]
name = "fundmon"
version = "0.1.0"
description = "基金盘中估值飞书提醒"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "chinesecalendar>=1.11.0",
    "httpx>=0.27.0",
    "lark-oapi>=1.4.0",
    "pydantic-settings>=2.4.0",
    "tzdata>=2024.1",
]

[project.scripts]
fundmon = "fundmon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
